name: Validate README

on:
  push:
    paths:
      - "README.md"
      - "scripts/validate_readme.py"
      - ".github/workflows/validate-readme.yml"
  pull_request:
    paths:
      - "README.md"
      - "scripts/validate_readme.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate README ordering and difficulty
        run: python3 scripts/validate_readme.py
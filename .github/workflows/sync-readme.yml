name: Sync README

on:
  push:
    branches: [ main ]
    paths:
      - "Python/**"
      - "C/**"
      - "Java/**"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync README (add new rows + update progress table)
        run: python3 scripts/sync_readme.py

      - name: Commit and push if README changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes to README.md; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Auto-sync README: add new problems and update progress table"
            git push
          fi